[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aksec"
version = "0.1.0"
description = "Internet-wide service discovery and search (Censys-like MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
aksec = "aksec.cli:main"

[tool.setuptools.packages.find]
include = ["aksec*"]

[tool.setuptools.package-data]
aksec = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
